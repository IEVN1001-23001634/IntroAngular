<div>
  <h2>Inicio de Sesión</h2>
  
  <div>
    <label>Usuario: </label>
    <input [(ngModel)]="usuarioIngresado" type="text" placeholder="Ingresa tu usuario">
  </div>
  <br>
  
  <div>
    <label>Contraseña: </label>
    <input [(ngModel)]="contrasenaIngresada" type="password" placeholder="Ingresa tu contraseña">
  </div>
  <br>
  
  <button (click)="validarAcceso()">Iniciar sesión</button>
  
  <br><br>
  <h4>{{ mensaje }}</h4>
</div>
